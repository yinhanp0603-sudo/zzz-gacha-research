<text x="28" y="60" font-size="12" fill="#667085">N=200，a=0.8→1.6，复核样本；共同分母为同种子基期总现金；横线为逐项 t95 区间</text>
<line x1="250.0" y1="100" x2="250.0" y2="352" stroke="#e5e7eb"/>
<text x="250.0" y="375" text-anchor="middle" font-size="11" fill="#667085">-8.2</text>
<line x1="377.5" y1="100" x2="377.5" y2="352" stroke="#e5e7eb"/>
<text x="377.5" y="375" text-anchor="middle" font-size="11" fill="#667085">-4.9</text>
<line x1="505.0" y1="100" x2="505.0" y2="352" stroke="#e5e7eb"/>
<text x="505.0" y="375" text-anchor="middle" font-size="11" fill="#667085">-1.7</text>
<line x1="632.5" y1="100" x2="632.5" y2="352" stroke="#e5e7eb"/>
<text x="632.5" y="375" text-anchor="middle" font-size="11" fill="#667085">+1.5</text>
<line x1="760.0" y1="100" x2="760.0" y2="352" stroke="#e5e7eb"/>
<text x="760.0" y="375" text-anchor="middle" font-size="11" fill="#667085">+4.8</text>
<line x1="572.0" y1="100" x2="572.0" y2="352" stroke="#667085" stroke-dasharray="5 4"/>
<text x="28" y="123" font-size="13">新主 C 池直购</text>
<line x1="292.5" x2="659.3" y1="118" y2="118" stroke="#2563eb" stroke-width="2"/>
<path d="M292.5,112V124 M659.3,112V124" stroke="#2563eb"/>
<circle cx="475.9" cy="118" r="5" fill="#2563eb"/>
<text x="778" y="123" font-size="13" font-weight="700">-2.44pp</text>
<text x="28" y="181" font-size="13">专拐直购</text>
<line x1="567.3" x2="579.5" y1="176" y2="176" stroke="#2563eb" stroke-width="2"/>
