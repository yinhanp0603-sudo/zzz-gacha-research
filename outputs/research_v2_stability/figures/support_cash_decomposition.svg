<path d="M438.6,286V298 M665.9,286V298" stroke="#172033"/>
<circle cx="552.2" cy="292" r="5" fill="#172033"/>
<text x="778" y="297" font-size="13" font-weight="700">-0.50pp</text>
<text x="505" y="401" font-size="12" text-anchor="middle" fill="#667085">占基期总现金的变化（百分点）；三项贡献之和为总现金相对变化</text>
</g></svg>