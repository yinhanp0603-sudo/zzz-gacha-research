name: 发布在线看板

on:
  push:
    branches: [main]
    paths:
      - "outputs/final_release/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 整个发布目录作为站点根，看板中的 ../report、../research 等相对链接保持有效
      - name: 组装站点
        run: |
          mkdir _site
          cp -r outputs/final_release/. _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>绝区零研究看板</title>
          <meta http-equiv="refresh" content="0; url=./dashboard/index.html">
          <link rel="canonical" href="./dashboard/index.html">
          <script>location.replace("./dashboard/index.html");</script>
          </head>
          <body>
          <p>正在打开<a href="./dashboard/index.html">在线交互看板</a>…</p>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
