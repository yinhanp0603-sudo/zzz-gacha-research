[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zzz-research"
version = "0.1.0"
description = "公开样本观测 + 战斗代理 + 显式行为情景的研究仿真"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
dashboard = ["streamlit>=1.30"]
charts = ["matplotlib>=3.8"]

[project.scripts]
zzz-research = "zzz_research.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zzz_research = ["storage/*.sql"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
